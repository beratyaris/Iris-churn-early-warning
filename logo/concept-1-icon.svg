<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 56 56" width="64" height="64" role="img" aria-label="Iris">
  <title>Iris - iris + gösterge</title>
  <!-- iris body -->
  <circle cx="32" cy="32" r="15" fill="#14B8A6" opacity=".16"/>
  <!-- 270° gauge ring: low / medium / high risk -->
  <g fill="none" stroke-width="8">
    <path d="M16.444 47.556A22 22 0 0 1 15.396 17.567" stroke="#14B8A6"/>
    <path d="M16.996 15.910A22 22 0 0 1 47.004 15.910" stroke="#F59E0B"/>
    <path d="M48.604 17.567A22 22 0 0 1 47.556 47.556" stroke="#FF7A59"/>
  </g>
  <!-- pupil + needle -->
  <path class="ink" d="M30.3 29.06L44.99 24.5L33.7 34.94Z" fill="#1E3A5F" stroke="#1E3A5F" stroke-width="1.6" stroke-linejoin="round"/>
  <circle class="ink" cx="32" cy="32" r="8.5" fill="#1E3A5F"/>
  <circle class="hl" cx="28.9" cy="29.2" r="2.3" fill="#FFFFFF"/>
</svg>
